name: CI

on:
  push:
    branches: [main, develop, release]
  pull_request:
    branches: [main, develop, release]

# Read-only unless a job asks for more (tag-release below).
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx prisma generate
      - run: npm test

  # End-to-end tests: the real API against a real MySQL database (see
  # backend/tests-e2e/README.md). The database is rebuilt from schema.prisma
  # on every run.
  backend-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erecruitment_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL_TEST: mysql://root:root@127.0.0.1:3306/erecruitment_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npx prisma generate
      - run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm test
      - run: npm run build

  # A push to release is a production release: once every check above has
  # passed, the commit is tagged vMAJOR.MINOR.PATCH and a GitHub Release
  # lists the pull requests since the previous tag and any new database
  # migrations. The first release is v1.0.0; after that the patch number
  # goes up, or the minor or major one when a commit since the last release
  # says [minor] or [major] (put it in the release PR's title). Production
  # installs a tag with deploy/production/update-production.sh --tag <tag>.
  tag-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: [backend, backend-e2e, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tag-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          existing=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' | head -n 1)
          if [ -n "$existing" ]; then
            echo "Already released as $existing (a re-run) - nothing to do."
            exit 0
          fi
          previous=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)
          if [ -z "$previous" ]; then
            tag="v1.0.0"
            range="HEAD"
          else
            IFS=. read -r major minor patch <<< "${previous#v}"
            log=$(git log --format=%B "$previous..HEAD")
            if grep -qiF '[major]' <<< "$log"; then
              tag="v$((major + 1)).0.0"
            elif grep -qiF '[minor]' <<< "$log"; then
              tag="v$major.$((minor + 1)).0"
            else
              tag="v$major.$minor.$((patch + 1))"
            fi
            range="$previous..HEAD"
          fi
          # New migrations run against production when the tag is installed;
          # the release note says which, so whoever installs it can judge a
          # rollback (deploy/production/README.md, "If it goes wrong").
          migrations=$(git diff --name-only --diff-filter=A ${previous:+"$previous"} HEAD -- backend/prisma/migrations             | awk -F/ 'NF >= 4 { print $4 }' | sort -u)
          if [ -z "$previous" ]; then migrations=""; fi
          {
            echo "## Database migrations"
            if [ -n "$migrations" ]; then
              echo "This release adds these migrations; they run when it is installed:"
              sed 's/^/- `/; s/$/`/' <<< "$migrations"
              echo ""
              echo "Before installing: say here whether they are backwards-compatible (adding columns or tables only), which decides whether a rollback is safe."
            else
              echo "None - rolling back to the previous release is safe for the database."
            fi
          } > notes.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          if [ -n "$previous" ]; then
            gh release create "$tag" --title "$tag" --notes-file notes.md --generate-notes --notes-start-tag "$previous" --verify-tag
          else
            gh release create "$tag" --title "$tag" --notes-file notes.md --generate-notes --verify-tag
          fi
          echo "Released $tag (previous: ${previous:-none}, range $range)" >> "$GITHUB_STEP_SUMMARY"
