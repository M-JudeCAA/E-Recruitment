name: CI

on:
  push:
    branches: [main, develop, release]
  pull_request:
    branches: [main, develop, release]

# Read-only unless a job asks for more (tag-release below).
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma generate
      - run: npm test

  # End-to-end tests: the real API against a real MySQL database (see
  # backend/tests-e2e/README.md). The database is rebuilt from schema.prisma
  # on every run.
  backend-e2e:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: erecruitment_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      DATABASE_URL_TEST: mysql://root:root@127.0.0.1:3306/erecruitment_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npx prisma generate
      - run: npm run test:e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
      - run: npm run build

  # A push to release is a production release: once every check above has
  # passed, the commit is tagged vYYYY.MM.DD (Kampala date; .2, .3, ... for a
  # second release that day) and a GitHub Release lists what changed since
  # the last one. The production server deploys only commits whose whole CI
  # run passed, so everything it deploys carries a tag (deploy/lan/README.md).
  tag-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    needs: [backend, backend-e2e, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: tag-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          existing=$(git tag --points-at HEAD --list 'v*' | tail -n 1)
          if [ -n "$existing" ]; then
            echo "Already released as $existing (a re-run) - nothing to do."
            exit 0
          fi
          base="v$(TZ=Africa/Kampala date +%Y.%m.%d)"
          tag="$base"
          n=1
          while git rev-parse -q --verify "refs/tags/$tag" >/dev/null; do
            n=$((n + 1))
            tag="$base.$n"
          done
          previous=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "Release $tag"
          git push origin "$tag"
          if [ -n "$previous" ]; then
            gh release create "$tag" --title "$tag" --generate-notes --notes-start-tag "$previous" --verify-tag
          else
            gh release create "$tag" --title "$tag" --generate-notes --verify-tag
          fi
          echo "Released $tag" >> "$GITHUB_STEP_SUMMARY"
