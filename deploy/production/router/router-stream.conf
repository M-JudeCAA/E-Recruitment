# /etc/nginx/router-stream.conf - the router's front door on port 443
# (deploy/production/README.md, 5.0).
# Included from the top level of /etc/nginx/nginx.conf, outside http {}.
#
# UCAA's public address 41.202.231.76: the Meraki forwards 80 and 443 here,
# and this passes each connection on by the name the browser asks for,
# without decrypting it - this server holds no certificates or keys. Each
# application keeps its own certificate, firewall and WAF.
#
# e-Recruitment gets the PROXY protocol, so its sites see the visitor's real
# address (rate limits, office-only emergency sign-in, audit log). AEDMS
# doesn't read it yet, so its connections go through a second hop
# (127.0.0.1:8444) that drops it.
#
# Adding an application: a line in the map, an upstream, and its DNS name
# pointing at 41.202.231.76; port 80 in sites-available/router.conf.
stream {
    log_format router_stream '$remote_addr [$time_local] "$ssl_preread_server_name" '
                             '$upstream_addr $status $bytes_sent $bytes_received $session_time';
    access_log /var/log/nginx/stream.access.log router_stream;

    # erecapp's entrance for the router: the sites with the PROXY protocol.
    upstream erecruitment { server 192.168.0.193:9443; }

    # Unknown names go to erecapp's catch-all, which refuses the handshake.
    map $ssl_preread_server_name $backend {
        careers.caa.co.ug          erecruitment;
        erecruitment.caa.co.ug     erecruitment;
        internal-careers.caa.co.ug erecruitment;
        aedms.caa.co.ug            127.0.0.1:8444;
        default                    erecruitment;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $backend;
        proxy_protocol on;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;            # the HR dashboard's socket stays open up to an hour
    }

    # AEDMS: take the PROXY header, pass the connection on without it.
    server {
        listen 127.0.0.1:8444 proxy_protocol;
        access_log off;                 # the server above already logged it
        set_real_ip_from 127.0.0.1;
        proxy_pass 192.168.20.150:443;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
}
