# /etc/nginx/sites-available/router.conf - port 80, passed on by host name
# (deploy/production/README.md, 5.0).
# Each application redirects to https itself and renews its own Let's
# Encrypt certificate over port 80, so requests go on as they came, Host
# included, with the visitor's address in X-Real-IP / X-Forwarded-For.
upstream erecruitment_http { server 192.168.0.193:80; }

# Unknown names and bare IP addresses get nothing
server {
    listen 80 default_server;
    return 444;
}

server {
    listen 80;
    server_name careers.caa.co.ug erecruitment.caa.co.ug internal-careers.caa.co.ug;
    location / {
        proxy_pass http://erecruitment_http;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 10s;
    }
}

server {
    listen 80;
    server_name aedms.caa.co.ug;
    access_log /var/log/nginx/aedms.access.log;
    location / {
        proxy_pass http://192.168.20.150;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 10s;
    }
}
