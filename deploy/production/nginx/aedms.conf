# /etc/nginx/sites-available/aedms.conf - AEDMS's plain http, passed on to its
# own server (README, 5.0). 41.202.231.76 carries both systems, so port 80
# arrives here too. AEDMS redirects to https itself and renews its
# Let's Encrypt certificate over port 80, so everything is passed on as it
# came, Host included. AEDMS's https goes through erecruit-stream.conf.
server {
    listen 80;
    server_name aedms.caa.co.ug;
    access_log /var/log/nginx/aedms.access.log;
    location / {
        proxy_pass http://192.168.20.150;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_connect_timeout 10s;
    }
}
