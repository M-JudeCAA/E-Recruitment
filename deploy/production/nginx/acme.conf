# /etc/nginx/sites-available/acme.conf - temporary, only while Let's Encrypt
# issues the first certificate (README, 5.1 option B); removed afterwards,
# when erecruitment.conf answers the checks.
server {
    listen 80;
    server_name careers.caa.co.ug erecruitment.caa.co.ug internal-careers.caa.co.ug;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 404; }
}
