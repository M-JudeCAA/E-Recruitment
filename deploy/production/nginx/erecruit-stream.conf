# /etc/nginx/erecruit-stream.conf - the front door on port 443 (README, 5.0).
# Included from the top level of /etc/nginx/nginx.conf, outside http {}.
#
# UCAA's public address 41.202.231.76 also carries AEDMS, and a port forward
# sends a port to one server only, so the firewall forwards 443 here and this
# passes each connection on by the name the browser asks for, without
# decrypting it: the three e-Recruitment names to the sites in
# erecruitment.conf (127.0.0.1:8443), aedms.caa.co.ug to the AEDMS server
# with its own certificate. Port 80 is shared the same way, by host name, in
# aedms.conf.
#
# Every connection reaches the next hop with the PROXY protocol, so the sites
# see the visitor's real address - rate limits, the office-only emergency
# sign-in and the audit log depend on it. AEDMS doesn't read it yet: its
# connections go through a second hop (127.0.0.1:8444) that drops it, so
# AEDMS sees this server as every visitor (README, 5.0).
stream {
    log_format erecruit_stream '$remote_addr [$time_local] "$ssl_preread_server_name" '
                               '$upstream_addr $status $bytes_sent $bytes_received $session_time';
    access_log /var/log/nginx/stream.access.log erecruit_stream;

    # Unknown names and connections without one go to erecruitment.conf's
    # catch-all, which refuses the handshake.
    map $ssl_preread_server_name $erecruit_backend {
        careers.caa.co.ug          127.0.0.1:8443;
        erecruitment.caa.co.ug     127.0.0.1:8443;
        internal-careers.caa.co.ug 127.0.0.1:8443;
        aedms.caa.co.ug            127.0.0.1:8444;
        default                    127.0.0.1:8443;
    }

    server {
        listen 443;
        ssl_preread on;
        proxy_pass $erecruit_backend;
        proxy_protocol on;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;            # the HR dashboard's socket stays open up to an hour
    }

    # AEDMS: take the PROXY header, pass the connection on without it.
    server {
        listen 127.0.0.1:8444 proxy_protocol;
        access_log off;                 # the server above already logged it
        set_real_ip_from 127.0.0.1;
        proxy_pass 192.168.20.150:443;
        proxy_connect_timeout 10s;
        proxy_timeout 3600s;
    }
}
