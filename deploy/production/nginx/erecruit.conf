# /etc/nginx/conf.d/erecruit.conf - office ranges, rate limits, log format,
# WebSocket helper (README, 5.5). Put every office range in the geo block,
# one line each.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# The office's own address ranges (1.1). The only addresses the emergency sign-in answers.
# NEVER the edge firewall's inside address: if the port forward hides internet
# visitors behind it, they would all count as the office - no rate limits, and
# the emergency sign-in reachable. If it falls inside an office range, give it
# its own line with 0 (geo takes the most specific match). README, 5.4 and 5.8.
geo $from_office {
    default 0;
    <office range 1, e.g. 10.10.0.0/16> 1;
    <office range 2> 1;
    # <firewall inside IP>/32 0;
}

# Rate limits per visitor address; office addresses are not limited.
# Generous on the public site: many mobile users in Uganda share one address.
map $from_office $limit_key {
    0 $binary_remote_addr;
    1 "";
}
limit_req_zone  $limit_key zone=public:20m rate=20r/s;
limit_req_zone  $limit_key zone=staff:10m  rate=5r/s;
limit_conn_zone $limit_key zone=perip:10m;
limit_req_status  429;
limit_conn_status 429;

log_format erecruit '$remote_addr [$time_local] "$host" "$request" $status '
                    '$body_bytes_sent $request_time "$http_user_agent" '
                    'upstream=$upstream_status id=$request_id';
