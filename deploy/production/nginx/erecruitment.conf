# /etc/nginx/sites-available/erecruitment.conf - the three sites (README, 5.6).
# Every request forwarded to the API carries X-ERecruitment-Site, set here
# so a visitor can't send their own; the API (REQUIRE_SITE_HEADER=true,
# backend/src/middleware/siteStamp.js) relies on it.
#
# https arrives through the front door on 443 (erecruit-stream.conf), which
# hands each connection over on 127.0.0.1:8443 with the PROXY protocol; the
# visitor's real address is read from it in snippets/erecruit-tls.conf.

# Unknown names and bare IP addresses get nothing
server {
    listen 80 default_server;
    listen 127.0.0.1:8443 ssl proxy_protocol default_server;
    ssl_reject_handshake on;
    return 444;
}

# Plain http: Let's Encrypt checks (5.1), everything else to https
server {
    listen 80;
    server_name careers.caa.co.ug erecruitment.caa.co.ug internal-careers.caa.co.ug;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}

# Public careers
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name careers.caa.co.ug;
    include snippets/erecruit-tls.conf;
    include snippets/erecruit-waf.conf;
    access_log /var/log/nginx/careers.access.log erecruit;
    limit_conn perip 200;
    limit_req zone=public burst=100 nodelay;
    # Maintenance switch: the internet sees the page, the office keeps working
    set $maint "";
    if (-f /etc/nginx/maintenance/careers) { set $maint "on"; }
    if ($from_office) { set $maint ""; }
    if ($uri = /maintenance.html) { set $maint ""; }
    if ($maint) { return 503; }
    error_page 503 /maintenance.html;
    location = /maintenance.html { root /var/www/maintenance; internal; }
    # Only the API areas candidates and committee links use. site-status
    # tells the pages whether the public site is open (EXTERNAL_SITE_ENABLED);
    # without it they would always show it open. A new area the candidate
    # pages call must be added here.
    location ~ ^/api/(candidates|applications|vacancies|shortlist-panel|files|site-status)(/|$) {
        proxy_set_header X-ERecruitment-Site public;
        proxy_read_timeout 300s;
        include snippets/erecruit-proxy.conf;
    }
    # Live updates for signed-in candidates (backend/src/realtime/dashboardSocket.js):
    # signals about their own records only, the session checked like the API's.
    location = /ws/candidate {
        modsecurity off;
        limit_req zone=public burst=10 nodelay;
        proxy_set_header X-ERecruitment-Site public;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        include snippets/erecruit-proxy.conf;
    }
    location ~ ^/(api|ws|health)(/|$) { return 404; }
    location /assets/ {
        include snippets/erecruit-page-headers.conf;
        expires 365d;
        try_files $uri =404;
    }
    location / {
        include snippets/erecruit-page-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

# HR workspace
server {
    listen 127.0.0.1:8443 ssl proxy_protocol;
    http2 on;
    server_name erecruitment.caa.co.ug;
    include snippets/erecruit-tls.conf;
    include snippets/erecruit-waf.conf;
    access_log /var/log/nginx/erecruitment.access.log erecruit;
    limit_conn perip 50;
    limit_req zone=staff burst=60 nodelay;
    set $maint "";
    if (-f /etc/nginx/maintenance/staff) { set $maint "on"; }
    if ($from_office) { set $maint ""; }
    if ($uri = /maintenance.html) { set $maint ""; }
    if ($maint) { return 503; }
    error_page 503 /maintenance.html;
    location = /maintenance.html { root /var/www/maintenance; internal; }
    # The emergency password sign-in: office addresses only, never the internet
    location = /api/staff/auth/login {
        if ($from_office = 0) { return 404; }
        proxy_set_header X-ERecruitment-Site staff;
        proxy_read_timeout 300s;
        include snippets/erecruit-proxy.conf;
    }
    location /api/ {
        proxy_set_header X-ERecruitment-Site staff;
        proxy_read_timeout 300s;
        include snippets/erecruit-proxy.conf;
    }
    location /ws/ {
        modsecurity off;
        limit_req zone=staff burst=10 nodelay;
        proxy_set_header X-ERecruitment-Site staff;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        include snippets/erecruit-proxy.conf;
    }
    location /assets/ {
        include snippets/erecruit-page-headers.conf;
        expires 365d;
        try_files $uri =404;
    }
    location / {
        include snippets/erecruit-page-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}

