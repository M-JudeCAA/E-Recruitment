# /etc/nginx/snippets/erecruit-tls.conf (README, 5.5)
ssl_certificate     /etc/nginx/tls/caa-co-ug.fullchain.pem;
ssl_certificate_key /etc/nginx/tls/caa-co-ug.key;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:erecruit:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;
client_max_body_size 15m;
large_client_header_buffers 4 16k;
root /srv/erecruitment/frontend/dist;
